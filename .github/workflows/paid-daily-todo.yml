name: Paid Marketing Daily To-do

# Starts the daily to-do list on the platform every weekday at 9:00 IST. The run itself happens on the platform (the Client Feedback Agent lists what each
# account manager has to do today and posts one Slack message with a check box per item); this only calls the secret-guarded address, which answers at once
# and runs in the background. Needs the same GitHub Actions secret as the other monitors, MONITOR_ALERT_SECRET. The platform's address is the repository
# variable PLATFORM_BASE_URL (default https://intelligence.position2.com).

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1-5'   # 03:30 UTC = 09:00 IST, Monday to Friday (GitHub may start it a few minutes late)

permissions:
  contents: read

concurrency:
  group: paid-daily-todo
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Start the daily to-do run
        env:
          BASE_URL: ${{ vars.PLATFORM_BASE_URL || 'https://intelligence.position2.com' }}
          SECRET: ${{ secrets.MONITOR_ALERT_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::The MONITOR_ALERT_SECRET secret is not set on this repository."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST "${BASE_URL%/}/p2/paid-marketing/api/dailytodo/scheduled" \
            -H "X-Monitor-Secret: $SECRET" -H "Content-Type: application/json" -d '{}'
          echo
