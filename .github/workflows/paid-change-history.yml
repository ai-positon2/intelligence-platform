name: Paid Marketing Change History

# Starts the Change History run on the platform every two hours. The run itself happens on the platform (it reads each Google Ads account's change history and sends a Slack
# line for every change made by someone not on the allowed list saved on the Change History page); this only calls the secret-guarded address, which answers at once and
# runs in the background. The first run sets the baseline and sends nothing.
#
# Needs the same GitHub Actions secret as the other monitors, MONITOR_ALERT_SECRET. The platform's address is the repository variable PLATFORM_BASE_URL
# (default https://intelligence.position2.com). Each run is one Google Ads read per account (the daily read allowance is shared by every agent).

on:
  workflow_dispatch:
  schedule:
    - cron: '20 */2 * * *'   # every two hours at :20 UTC (GitHub may start it a few minutes late)

permissions:
  contents: read

concurrency:
  group: paid-change-history
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Start the Change History run
        env:
          BASE_URL: ${{ vars.PLATFORM_BASE_URL || 'https://intelligence.position2.com' }}
          SECRET: ${{ secrets.MONITOR_ALERT_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::The MONITOR_ALERT_SECRET secret is not set on this repository."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST "${BASE_URL%/}/p2/paid-marketing/api/changes/scheduled" \
            -H "X-Monitor-Secret: $SECRET" -H "Content-Type: application/json" -d '{}'
          echo
