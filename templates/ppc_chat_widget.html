<!-- ── Kairo AI Chat Widget v4 (redesign + feature release) ─────────────────── -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
#k-root{
  --k-i:#6366f1; --k-v:#a855f7; --k-f:#ec4899; --k-cyan:#22d3ee; --k-em:#34d399;
  --k-radius:24px;
  --k-panel:linear-gradient(168deg,#0e1126 0%,#0a0c1c 55%,#0c0f22 100%);
  --k-surface:rgba(255,255,255,.045);
  --k-surface2:rgba(255,255,255,.07);
  --k-ink:#eef1fb; --k-ink2:#a5adcf; --k-ink3:#6c769b;
  --k-line:rgba(255,255,255,.08);
  --k-scrim:rgba(4,5,12,.62);
  font-family:'Space Grotesk',system-ui,sans-serif;
}
#k-root[data-ktheme="light"]{
  --k-panel:linear-gradient(168deg,#ffffff 0%,#f5f6fc 60%,#eef0fb 100%);
  --k-surface:rgba(20,22,48,.04);
  --k-surface2:rgba(99,102,241,.08);
  --k-ink:#11142b; --k-ink2:#4b5572; --k-ink3:#8089a8;
  --k-line:rgba(20,22,48,.1);
  --k-scrim:rgba(20,22,48,.32);
}
#k-root[data-kdensity="compact"]{ --k-radius:18px; }
#k-root *{box-sizing:border-box}

/* launcher */
#k-wrap{position:fixed;bottom:30px;right:30px;z-index:10000}
#k-fab{position:relative;width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(140deg,#6366f1,#8b5cf6 55%,#a855f7);display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 34px rgba(99,102,241,.55),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s}
#k-fab::before{content:'';position:absolute;inset:-3px;border-radius:50%;z-index:-1;
  background:conic-gradient(from 0deg,#6366f1,#a855f7,#22d3ee,#ec4899,#6366f1);filter:blur(7px);opacity:.55;animation:k-spin 5s linear infinite}
#k-fab:hover{transform:scale(1.1) rotate(6deg)}
#k-fab.open{opacity:0;pointer-events:none;transform:scale(.8)}
@keyframes k-spin{to{transform:rotate(360deg)}}
#k-badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:11px;
  background:#ec4899;color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;
  border:2px solid #05060f;box-shadow:0 3px 10px rgba(236,72,153,.6)}
#k-badge.show{display:flex;animation:k-pop .3s cubic-bezier(.34,1.56,.64,1)}
@keyframes k-pop{from{transform:scale(0)}to{transform:scale(1)}}
#k-tip{position:absolute;bottom:calc(100% + 12px);right:0;white-space:nowrap;background:rgba(8,10,28,.97);
  border:1px solid rgba(99,102,241,.35);color:#c7d2fe;font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:9px;
  opacity:0;transform:translateY(6px);transition:.2s;pointer-events:none}
#k-wrap:hover #k-tip{opacity:1;transform:translateY(0)}

/* shell */
#k-border{position:fixed;bottom:106px;right:30px;width:418px;z-index:9999;border-radius:var(--k-radius);padding:1.25px;
  background:linear-gradient(150deg,rgba(99,102,241,.9),rgba(168,85,247,.55),rgba(34,211,238,.45),rgba(236,72,153,.65));
  background-size:280% 280%;animation:k-edge 7s ease infinite;opacity:0;transform:translateY(20px) scale(.95);pointer-events:none;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s,width .25s,height .25s;
  box-shadow:0 40px 90px rgba(0,0,0,.62),0 0 70px rgba(99,102,241,.14)}
#k-border.open{opacity:1;transform:translateY(0) scale(1);pointer-events:all}
#k-border.expanded{top:14px;bottom:14px;right:14px;width:440px;height:auto}
#k-border.expanded #k-panel{height:100%}
@keyframes k-edge{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@media (max-width: 480px){ #k-border{width:calc(100vw - 16px) !important;right:8px;bottom:84px} #k-wrap{right:14px;bottom:14px} }

#k-panel{border-radius:calc(var(--k-radius) - 1.25px);background:var(--k-panel);overflow:hidden;position:relative;
  display:flex;flex-direction:column;height:640px;transition:height .3s}
#k-root[data-kdensity="compact"] #k-panel{height:560px}
#k-panel::before{content:'';position:absolute;top:-120px;left:-90px;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(99,102,241,.16),transparent 70%);pointer-events:none;animation:k-orb 9s ease-in-out infinite}
#k-panel::after{content:'';position:absolute;bottom:-110px;right:-90px;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(168,85,247,.14),transparent 70%);pointer-events:none;animation:k-orb2 12s ease-in-out infinite}
@keyframes k-orb{0%,100%{transform:translate(0,0)}50%{transform:translate(26px,18px)}}
@keyframes k-orb2{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,-22px)}}

/* resize handle */
#k-resize{position:absolute;top:0;left:0;width:16px;height:16px;cursor:nwse-resize;z-index:6}
#k-resize::after{content:'';position:absolute;top:5px;left:5px;width:7px;height:7px;border-top:2px solid var(--k-ink3);border-left:2px solid var(--k-ink3);border-radius:1px;opacity:.5}

/* header */
#k-hdr{position:relative;z-index:2;padding:15px 15px 13px;cursor:grab;
  background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 46%,#c026d3 100%);border-bottom:1px solid rgba(255,255,255,.1);overflow:hidden}
#k-hdr:active{cursor:grabbing}
#k-hdr::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(150px 90px at 16% -10%,rgba(255,255,255,.3),transparent 70%),radial-gradient(120px 120px at 100% 120%,rgba(34,211,238,.22),transparent 70%)}
.k-htop{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
.k-av{width:44px;height:44px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.16);backdrop-filter:blur(6px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 8px 22px rgba(0,0,0,.3)}
.k-hinfo{flex:1;min-width:0}
.k-hname{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em;line-height:1;margin-bottom:5px}
.k-hstatus{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.85);font-weight:500}
.k-live{width:7px;height:7px;border-radius:50%;background:#34f5c5;box-shadow:0 0 9px #34f5c5;animation:k-pulse 2s infinite}
@keyframes k-pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,245,197,.5)}50%{opacity:.65;box-shadow:0 0 0 6px rgba(52,245,197,0)}}
.k-hbtns{display:flex;gap:5px}
.k-hb{width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.12);
  color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.16s;position:relative;flex-shrink:0}
.k-hb:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
.k-hb-badge{position:absolute;top:-4px;right:-4px;min-width:14px;height:14px;padding:0 3px;border-radius:8px;background:#22d3ee;
  color:#06283d;font-size:8px;font-weight:700;display:none;align-items:center;justify-content:center;border:1.5px solid #5b21b6}
.k-hb-badge.show{display:flex}
.k-pills{display:flex;gap:6px;margin-top:12px;position:relative;z-index:1;flex-wrap:wrap}
.k-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:999px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);color:#fff;backdrop-filter:blur(6px);transition:.18s;cursor:pointer}
.k-pill:hover{background:rgba(255,255,255,.3);transform:translateY(-1px)}
.k-pill.active{background:#fff;color:#5b21b6}

/* body */
#k-body{flex:1;overflow-y:auto;position:relative;z-index:2;padding:20px 16px 8px}
#k-body::-webkit-scrollbar{width:3px}#k-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}

/* welcome */
.k-orbwrap{display:flex;justify-content:center;margin-bottom:13px;position:relative}
.k-bigorb{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(140deg,#6366f1,#8b5cf6,#c026d3);box-shadow:0 12px 34px rgba(124,58,237,.55),inset 0 1px 0 rgba(255,255,255,.4);
  animation:k-float 4.5s ease-in-out infinite}
@keyframes k-float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(4deg)}}
.k-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:27px;border:1.5px solid rgba(124,131,245,.28);animation:k-expand 3s ease-in-out infinite}
.k-ring2{width:110px;height:110px;border-radius:33px;border-color:rgba(124,131,245,.14);animation-delay:.6s}
@keyframes k-expand{0%,100%{opacity:.8;transform:translate(-50%,-50%) scale(1)}50%{opacity:.25;transform:translate(-50%,-50%) scale(1.06)}}
.k-greet{text-align:center;font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px;
  background:linear-gradient(180deg,var(--k-ink),#9aa3d6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.k-sub{text-align:center;font-size:12.5px;color:var(--k-ink2);line-height:1.6;max-width:300px;margin:0 auto 20px}
.k-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.k-card{position:relative;text-align:left;padding:13px;border-radius:16px;cursor:pointer;overflow:hidden;background:var(--k-surface);
  border:1px solid var(--k-line);transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .25s,background .2s}
.k-card:hover{transform:translateY(-4px);background:var(--k-surface2);border-color:rgba(129,140,248,.55);box-shadow:0 16px 34px rgba(76,52,183,.32)}
.k-card-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.k-ic-leads{background:linear-gradient(135deg,rgba(251,146,60,.32),rgba(239,68,68,.28))}
.k-ic-ads{background:linear-gradient(135deg,rgba(236,72,153,.3),rgba(168,85,247,.28))}
.k-ic-sig{background:linear-gradient(135deg,rgba(34,211,238,.28),rgba(59,130,246,.28))}
.k-ic-mail{background:linear-gradient(135deg,rgba(52,211,153,.3),rgba(16,185,129,.26))}
.k-card-t{font-size:13px;font-weight:700;color:var(--k-ink);margin-bottom:3px;letter-spacing:-.01em}
.k-card-d{font-size:10.5px;color:var(--k-ink3);line-height:1.45}
.k-card-go{position:absolute;top:13px;right:12px;color:#8b93f7;opacity:0;transform:translateX(-5px);transition:.2s}
.k-card:hover .k-card-go{opacity:1;transform:translateX(0)}
.k-sugt{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--k-ink3);margin:0 2px 10px;display:flex;justify-content:space-between;align-items:center}
.k-sugt a{color:#8b93f7;text-transform:none;letter-spacing:0;cursor:pointer;font-weight:600}
.k-chips{display:flex;flex-direction:column;gap:7px}
.k-chip{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:500;color:var(--k-ink2);padding:10px 12px;border-radius:12px;cursor:pointer;background:var(--k-surface);border:1px solid var(--k-line);transition:.2s}
.k-chip:hover{background:var(--k-surface2);border-color:rgba(129,140,248,.5);color:var(--k-ink);transform:translateX(3px)}
.k-chip .ke{font-size:14px;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:rgba(124,131,245,.16);flex-shrink:0}
.k-chip .kg{margin-left:auto;color:var(--k-ink3)}

/* message rows */
.k-row{display:flex;gap:9px;margin-bottom:13px;animation:k-in .32s cubic-bezier(.34,1.56,.64,1) both;position:relative}
@keyframes k-in{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.k-row.user{flex-direction:row-reverse}
.k-ra{width:30px;height:30px;border-radius:10px;flex-shrink:0;align-self:flex-end;display:flex;align-items:center;justify-content:center}
.k-row.assistant .k-ra{background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 4px 12px rgba(124,58,237,.5)}
.k-row.user .k-ra{background:var(--k-surface2);border:1px solid var(--k-line);font-size:10px;font-weight:700;color:var(--k-ink2)}
.k-bcol{display:flex;flex-direction:column;max-width:82%}
.k-row.user .k-bcol{align-items:flex-end}
.k-bub{padding:10px 13px;font-size:13px;line-height:1.7;border-radius:16px;position:relative}
.k-row.assistant .k-bub{background:var(--k-surface);border:1px solid var(--k-line);border-left:2.5px solid #8b5cf6;color:var(--k-ink);border-bottom-left-radius:5px}
.k-row.user .k-bub{background:linear-gradient(135deg,rgba(99,102,241,.32),rgba(168,85,247,.24));border:1px solid rgba(129,140,248,.4);color:var(--k-ink);border-bottom-right-radius:5px}
.k-bub b,.k-bub strong{color:var(--k-ink);font-weight:700}
.k-bub ul{margin:5px 0 2px 16px;padding:0}.k-bub li{margin-bottom:3px;color:var(--k-ink2)}
.k-bub p{margin:4px 0}.k-bub p:first-child{margin-top:0}.k-bub p:last-child{margin-bottom:0}
.k-ts{font-size:9.5px;color:var(--k-ink3);margin-top:3px;padding:0 3px}
/* citations */
.k-cite{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:600;padding:1px 7px;border-radius:999px;
  background:rgba(34,211,238,.14);border:1px solid rgba(34,211,238,.3);color:#67e8f9;margin:0 2px;vertical-align:1px;cursor:help}
#k-root[data-ktheme="light"] .k-cite{color:#0e7490}
/* per-message toolbar */
.k-tools{display:flex;gap:3px;margin-top:5px;opacity:0;transform:translateY(-3px);transition:.18s}
.k-row:hover .k-tools{opacity:1;transform:none}
.k-tb{width:24px;height:24px;border-radius:7px;border:1px solid var(--k-line);background:var(--k-surface);color:var(--k-ink3);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.k-tb:hover{background:var(--k-surface2);color:var(--k-ink)}
.k-tb.on-up{color:#34d399;border-color:rgba(52,211,153,.4)}
.k-tb.on-down{color:#f87171;border-color:rgba(248,113,113,.4)}

/* typing dots */
.k-typing{display:flex;gap:4px;align-items:center;padding:13px 15px}
.k-typing span{width:6px;height:6px;border-radius:50%;background:var(--k-ink2);animation:k-bounce 1s infinite}
.k-typing span:nth-child(2){animation-delay:.15s}.k-typing span:nth-child(3){animation-delay:.3s}
@keyframes k-bounce{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
.k-cursor{display:inline-block;width:7px;height:14px;background:#a855f7;margin-left:2px;border-radius:1px;animation:k-blink 1s step-end infinite;vertical-align:-2px}
@keyframes k-blink{50%{opacity:0}}

/* data table */
.k-table-wrap{margin-top:9px;border:1px solid var(--k-line);border-radius:10px;overflow:auto;max-height:240px}
table.k-table{border-collapse:collapse;width:100%;font-size:11.5px}
.k-table th{position:sticky;top:0;background:var(--k-surface2);color:var(--k-ink);font-weight:700;text-align:left;padding:7px 9px;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--k-line)}
.k-table th:hover{color:#a855f7}
.k-table td{padding:6px 9px;color:var(--k-ink2);border-bottom:1px solid var(--k-line);white-space:nowrap}
.k-table tr:last-child td{border-bottom:none}
.k-table-bar{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* chart */
.k-chart{margin-top:9px;background:var(--k-surface);border:1px solid var(--k-line);border-radius:10px;padding:10px;height:180px}

/* action buttons under a reply */
.k-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.k-act{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:6px 11px;border-radius:9px;cursor:pointer;
  background:rgba(99,102,241,.13);border:1px solid rgba(99,102,241,.3);color:#a5b4fc;transition:.16s;font-family:inherit}
.k-act:hover{background:rgba(99,102,241,.25);transform:translateY(-1px)}
.k-act.k-act-hub{background:rgba(236,72,153,.13);border-color:rgba(236,72,153,.3);color:#f9a8d4}
.k-act.k-act-slk{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.3);color:#6ee7b7}

/* dossier / ad cards */
.k-doss{margin-top:9px;border:1px solid var(--k-line);border-radius:13px;overflow:hidden;background:var(--k-surface)}
.k-doss-h{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--k-surface2)}
.k-doss-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#a855f7);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;flex-shrink:0}
.k-doss-name{font-size:13px;font-weight:700;color:var(--k-ink)}
.k-doss-meta{font-size:10.5px;color:var(--k-ink3)}
.k-doss-score{margin-left:auto;text-align:center;padding:4px 10px;border-radius:9px;background:rgba(251,146,60,.16);border:1px solid rgba(251,146,60,.3)}
.k-doss-score b{display:block;font-size:16px;color:#fdba74;line-height:1}.k-doss-score i{font-size:8.5px;color:var(--k-ink3);font-style:normal}
.k-doss-body{padding:11px 12px;display:flex;flex-direction:column;gap:7px}
.k-doss-sig{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--k-ink2)}
.k-doss-sig .kd-ic{width:22px;height:22px;border-radius:6px;background:rgba(124,131,245,.16);display:flex;align-items:center;justify-content:center;font-size:11px}

/* composer */
#k-input-area{position:relative;z-index:2;padding:10px 14px 12px;border-top:1px solid var(--k-line);background:linear-gradient(0deg,rgba(6,7,18,.45),transparent)}
#k-root[data-ktheme="light"] #k-input-area{background:linear-gradient(0deg,rgba(120,125,180,.06),transparent)}
#k-irow{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:15px;background:var(--k-surface);border:1px solid var(--k-line);transition:.2s}
#k-irow:focus-within{border-color:rgba(129,140,248,.55);box-shadow:0 0 0 3px rgba(99,102,241,.13)}
.k-ib{width:32px;height:32px;border-radius:9px;flex-shrink:0;border:1px solid var(--k-line);background:var(--k-surface);color:var(--k-ink3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.18s}
.k-ib:hover{background:rgba(99,102,241,.16);border-color:rgba(129,140,248,.4);color:#aab2ff;transform:scale(1.06)}
.k-ib.rec{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.5);color:#fca5a5;animation:k-pulse 1.2s infinite}
#k-input{flex:1;background:transparent;border:none;outline:none;color:var(--k-ink);font-size:13.5px;font-family:inherit;resize:none;line-height:1.5;max-height:96px;min-height:20px}
#k-input::placeholder{color:var(--k-ink3)}
#k-send{width:38px;height:38px;border-radius:12px;border:none;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 4px 16px rgba(124,58,237,.55);transition:.2s}
#k-send:hover:not(:disabled){transform:scale(1.1) rotate(-6deg)}
#k-send:disabled{opacity:.4;cursor:not-allowed}
#k-stop{display:none;width:38px;height:38px;border-radius:12px;border:1px solid rgba(248,113,113,.5);background:rgba(239,68,68,.18);color:#fca5a5;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0}
#k-stop.show{display:flex}
#k-foot{text-align:center;font-size:9.5px;color:var(--k-ink3);margin-top:8px}
.k-filepill{display:none;align-items:center;gap:7px;margin-top:7px;padding:6px 10px;border-radius:10px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.25)}
.k-filepill.show{display:flex}
.k-filepill .fl{flex:1;min-width:0;font-size:11.5px;font-weight:600;color:#a5b4fc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-filepill button{width:18px;height:18px;border:none;border-radius:5px;background:var(--k-surface2);color:var(--k-ink3);cursor:pointer;flex-shrink:0}

/* autocomplete popups */
.k-pop{position:absolute;left:14px;right:14px;bottom:72px;z-index:8;background:var(--k-panel);border:1px solid var(--k-line);border-radius:13px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);overflow:hidden;display:none;max-height:210px;overflow-y:auto}
.k-pop.on{display:block;animation:k-in .16s}
.k-pop-item{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;font-size:12px;color:var(--k-ink2)}

.k-emoji{position:absolute;left:12px;bottom:64px;z-index:8;width:232px;padding:8px;display:none;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--k-panel);border:1px solid var(--k-line);border-radius:13px;box-shadow:0 20px 50px rgba(0,0,0,.5)}

.k-emoji button:hover{background:var(--k-surface2)}

/* drawer / panels (history, settings, memory, confirm, onboarding) */
.k-scrim{position:absolute;inset:0;z-index:20;background:var(--k-scrim);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.22s}
.k-scrim.on{opacity:1;pointer-events:all}
.k-drawer{position:absolute;top:0;bottom:0;left:0;width:80%;max-width:330px;z-index:21;background:var(--k-panel);border-right:1px solid var(--k-line);
  transform:translateX(-103%);transition:transform .3s cubic-bezier(.34,1.3,.64,1);display:flex;flex-direction:column}
.k-drawer.on{transform:translateX(0)}
.k-sheet{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%) scale(.95);z-index:22;background:var(--k-panel);
  border:1px solid var(--k-line);border-radius:18px;box-shadow:0 30px 70px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.22s;max-height:82%;display:flex;flex-direction:column}
.k-sheet.on{opacity:1;pointer-events:all;transform:translateY(-50%) scale(1)}
.k-ph{display:flex;align-items:center;gap:9px;padding:14px 15px;border-bottom:1px solid var(--k-line)}
.k-ph h4{margin:0;font-size:14px;font-weight:700;color:var(--k-ink);flex:1}
.k-ph .x{width:28px;height:28px;border-radius:8px;border:1px solid var(--k-line);background:var(--k-surface);color:var(--k-ink2);cursor:pointer;display:flex;align-items:center;justify-content:center}
.k-pbody{padding:13px 15px;overflow-y:auto}
.k-search{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--k-line);background:var(--k-surface);color:var(--k-ink);font-size:12.5px;font-family:inherit;outline:none;margin-bottom:10px}
.k-search:focus{border-color:rgba(129,140,248,.5)}
.k-sess{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:11px;cursor:pointer;margin-bottom:6px;border:1px solid transparent}
.k-sess:hover{background:var(--k-surface);border-color:var(--k-line)}
.k-sess .si{width:30px;height:30px;border-radius:9px;background:rgba(124,131,245,.16);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.k-sess .st{flex:1;min-width:0}
.k-sess .st b{display:block;font-size:12.5px;color:var(--k-ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-sess .st i{font-size:10px;color:var(--k-ink3);font-style:normal}
.k-sess .del{width:24px;height:24px;border:none;border-radius:7px;background:transparent;color:var(--k-ink3);cursor:pointer;opacity:0}
.k-sess:hover .del{opacity:1}.k-sess .del:hover{background:rgba(239,68,68,.18);color:#f87171}
.k-newbtn{width:100%;padding:10px;border-radius:11px;border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:700;color:#fff;

/* settings rows */
.k-set{margin-bottom:16px}
.k-set-l{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--k-ink3);margin-bottom:8px}

/* memory chips */

<script>
(function(){
  "use strict";
  var root = document.getElementById('k-root');
  var body = document.getElementById('k-body');
  var input = document.getElementById('k-input');

  /* ---------- persistence ---------- */
  var LS = {sess:'kairo_sessions_v2', mem:'kairo_mem_v2', set:'kairo_settings_v2', pin:'kairo_pins_v2', aud:'kairo_audit_v2', onb:'kairo_onb_v2', nud:'kairo_nudge_v2'};
  function load(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
  function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

  var _sessions = load(LS.sess, []);
  var _mem      = load(LS.mem, {personal:[], team:[]});
  var _settings = load(LS.set, {theme:'dark', density:'cozy', vertical:'', cpa:'', tone:'Warm, concise, consultative', voiceReply:false, sound:true});
  var _pinned   = load(LS.pin, []);
  var _audit    = load(LS.aud, []);
  var _acct     = 'all';
  var _curId    = null;
  var _hist     = [];
  var _file     = null, _uploading=false;
  var _busy=false, _abort=false, _fresh=true;
  var _companies = [];
  var _selIdx = -1;
  var _justOpened = 0;

  /* migrate v1 memory */
  (function(){ try{ var old=localStorage.getItem('ppc_chat_mem_v1'); if(old && (!_mem.personal||!_mem.personal.length)){ _mem.personal=(JSON.parse(old)||[]).map(function(t){return {text:t,cat:'General'};}); save(LS.mem,_mem);} }catch(e){} })();

  function memList(){ var t=(_mem.personal||[]).concat(_mem.team||[]); return t.map(function(m){return m.text;}); }
  function applyTheme(){ root.setAttribute('data-ktheme', _settings.theme); root.setAttribute('data-kdensity', _settings.density); }
  applyTheme();

  function audit(action, detail){ _audit.unshift({ts:Date.now(), action:action, detail:detail||''}); _audit=_audit.slice(0,200); save(LS.aud,_audit); }

  /* ---------- session helpers ---------- */
  function newSession(){ _curId='s'+Date.now(); _hist=[]; _sessions.unshift({id:_curId,title:'New chat',ts:Date.now(),hist:[]}); save(LS.sess,_sessions); }
  function curSession(){ return _sessions.filter(function(s){return s.id===_curId;})[0]; }
  function persistSession(){ var s=curSession(); if(!s){return;} s.hist=_hist.slice(-60); s.ts=Date.now();
    if((s.title==='New chat'||!s.title) && _hist.length){ var f=_hist.filter(function(m){return m.role==='user';})[0]; if(f){ s.title=f.content.slice(0,46); } }

  /* ---------- send + streaming ---------- */
  window.ppcSend = function(){
    if(_busy||_uploading){ return; }
    var msg=(input.value||'').trim();
    if(!msg && !_file){ return; }
    hidePops();
    var wlc=body.querySelector('.k-greet'); if(wlc){ body.innerHTML=''; }
    if(!_curId){ newSession(); }
    /* slash command expansion */
    msg = expandSlash(msg);
    input.value=''; input.style.height='auto';
    var disp=msg; if(_file){ disp=(_file.is_image?'🖼️ ':'📎 ')+_file.name+(msg?'\n'+msg:''); }
    addMsg('user', disp||'Analyse this file.');
    _hist.push({role:'user',content:msg||'Analyse this file.'});
    beep('send');
    runChat(msg);
  };

  function runChat(msg){
    var payload={message:msg||'', history:_hist.slice(-12), memories:memList(), account:_acct};
    var fmtReq=detectExport(msg);
    if(fmtReq && !_file){ payload.export_format=fmtReq; }
    if(_file){ payload.file_name=_file.name; payload.file_is_image=_file.is_image; payload.file_truncated=_file.truncated||false;
      if(_file.is_image){ payload.file_mime=_file.mime; payload.file_base64=_file.base64; } else { payload.file_content=_file.content; }
      kRemoveFile();
    }
    var load=loader(); setBusy(true); _abort=false;
    fetch('/api/ppc-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
      .then(function(r){ return r.json(); })
      .then(function(d){ load.remove(); var ans=d.answer||'No response received.'; streamIn(ans); })
      .catch(function(){ load.remove(); retryRow(msg); })
      .finally(function(){ setBusy(false); });
  }

  function streamIn(text){
    beep('recv');
    var m=addMsg('assistant','',{streaming:true});
    var tokens=text.split(/(\s+)/); var i=0; var acc='';
    (function step(){
      if(_abort){ finishStream(m,acc||text); return; }
      if(i>=tokens.length){ finishStream(m,text); return; }
      acc+=tokens[i]; i++;
      m.bub.innerHTML=fmt(citeify(acc))+'<span class="k-cursor"></span>';
      scroll();
      setTimeout(step, 14);
    })();
  }
  function finishStream(m,text){
    m.bub.innerHTML=fmt(citeify(text));
    decorate(m.row,m.bub,'assistant',text);
    _hist.push({role:'assistant',content:text.length>1200?text.slice(0,1200)+'…':text});
    persistSession();
    if(_settings.voiceReply){ speak(stripHtml(m.bub)); }
    scroll();
  }

  /* ---------- tables + charts ---------- */
  function maybeTable(bub, text){
    var lines=text.trim().split('\n').filter(function(l){return l.trim();});
    var pipe=lines.filter(function(l){return l.indexOf('|')>=0;});
    var rows=null;
    if(pipe.length>=2){ rows=pipe.map(function(l){ return l.replace(/^\||\|$/g,'').split('|').map(function(c){return c.trim();}); }).filter(function(r){ return !/^[-: ]+$/.test(r.join('')); }); }
    else { var csv=lines.filter(function(l){return (l.match(/,/g)||[]).length>=1;}); if(csv.length>=2 && csv.length===lines.length){ rows=csv.map(function(l){return l.split(',').map(function(c){return c.trim();});}); } }
    if(!rows || rows.length<2 || rows[0].length<2){ return; }
    bub.innerHTML='';
    renderTable(bub, rows);
  }
  function renderTable(bub, rows){
    var head=rows[0], data=rows.slice(1), sortCol=-1, sortDir=1, filter='';
    var wrap=document.createElement('div');
    var bar=document.createElement('div'); bar.className='k-table-bar';
    var search=document.createElement('input'); search.className='k-search'; search.style.margin='0 0 8px'; search.placeholder='Filter rows…'; search.oninput=function(){ filter=this.value.toLowerCase(); draw(); };
    bub.appendChild(search);
    var tw=document.createElement('div'); tw.className='k-table-wrap'; bub.appendChild(tw);
    function draw(){
      var d=data.filter(function(r){ return !filter || r.join(' ').toLowerCase().indexOf(filter)>=0; });
      if(sortCol>=0){ d=d.slice().sort(function(a,b){ var x=a[sortCol]||'',y=b[sortCol]||''; var nx=parseFloat(x.replace(/[^0-9.\-]/g,'')),ny=parseFloat(y.replace(/[^0-9.\-]/g,'')); if(!isNaN(nx)&&!isNaN(ny)){ return (nx-ny)*sortDir; } return x.localeCompare(y)*sortDir; }); }
      var h='<table class="k-table"><thead><tr>'+head.map(function(c,i){ return '<th data-i="'+i+'">'+esc(c)+(sortCol===i?(sortDir>0?' ▲':' ▼'):'')+'</th>'; }).join('')+'</tr></thead><tbody>'+d.map(function(r){ return '<tr>'+r.map(function(c){return '<td>'+esc(c)+'</td>';}).join('')+'</tr>'; }).join('')+'</tbody></table>';
      tw.innerHTML=h;
      var ths=tw.querySelectorAll('th'); for(var i=0;i<ths.length;i++){ ths[i].onclick=function(){ var ci=+this.getAttribute('data-i'); if(sortCol===ci){ sortDir=-sortDir; } else { sortCol=ci; sortDir=1; } draw(); }; }
    }
    draw();
    bar.appendChild(exb('CSV',function(){ dl(toCSV(rows),'kairo_export.csv','text/csv'); }));
    bar.appendChild(exb('Excel',function(){ toXLSX(rows); }));
    bar.appendChild(exb('JSON',function(){ dl(JSON.stringify(rowsToObj(rows),null,2),'kairo_export.json','application/json'); }));
    bar.appendChild(exb('PDF',function(){ toPDF(rows); }));
    bar.appendChild(exb('📊 Chart',function(){ chartFrom(bub,rows); }));
    bar.appendChild(exb('Sheets',function(){ confirmWrite('Google Sheets','Append this table to a Google Sheet.',toCSV(rows),'sheets'); }));
    bub.appendChild(bar);
  }
  function exb(label,fn){ var b=document.createElement('button'); b.className='k-act'; b.textContent=label; b.onclick=fn; return b; }
  function rowsToObj(rows){ var h=rows[0]; return rows.slice(1).map(function(r){ var o={}; h.forEach(function(k,i){o[k]=r[i];}); return o; }); }
  function toCSV(rows){ return rows.map(function(r){ return r.map(function(c){ return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(','); }).join('\n'); }
  function toXLSX(rows){ try{ var ws=XLSX.utils.aoa_to_sheet(rows); var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Kairo'); XLSX.writeFile(wb,'kairo_export.xlsx'); audit('export','xlsx'); }catch(e){ toast('err','Excel export unavailable'); } }
  function toPDF(rows){ try{ var jsPDF=window.jspdf.jsPDF; var doc=new jsPDF(); doc.setFontSize(12); doc.text('Kairo export',14,16); var y=26; rows.slice(0,40).forEach(function(r){ doc.setFontSize(9); doc.text(r.join('  |  ').slice(0,180),14,y); y+=7; if(y>280){doc.addPage();y=16;} }); doc.save('kairo_export.pdf'); audit('export','pdf'); }catch(e){ toast('err','PDF export unavailable'); } }
  function chartFrom(bub,rows){ var holder=document.createElement('div'); holder.className='k-chart'; var cv=document.createElement('canvas'); holder.appendChild(cv); bub.appendChild(holder);
    var labels=rows.slice(1).map(function(r){return r[0];}); var numCol=-1; for(var c=1;c<rows[0].length;c++){ if(!isNaN(parseFloat((rows[1][c]||'').replace(/[^0-9.\-]/g,'')))){ numCol=c; break; } }
    if(numCol<0){ toast('err','No numeric column to chart'); holder.remove(); return; }
    var vals=rows.slice(1).map(function(r){ return parseFloat((r[numCol]||'0').replace(/[^0-9.\-]/g,''))||0; });
    try{ new Chart(cv,{type:'bar',data:{labels:labels,datasets:[{label:rows[0][numCol],data:vals,backgroundColor:'rgba(139,92,246,.6)',borderColor:'#a855f7',borderWidth:1,borderRadius:5}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#a5adcf',font:{size:9}}},y:{ticks:{color:'#a5adcf',font:{size:9}}}}}}); audit('chart','bar'); }catch(e){ toast('err','Chart unavailable'); } }

    var emo=document.getElementById('k-emoji'); if(emo.classList.contains('on') && !emo.contains(e.target)){ emo.classList.remove('on'); }
  });

  /* ---------- drag + resize ---------- */
  (function(){ var hdr=document.getElementById('k-hdr'), border=document.getElementById('k-border'); var dx,dy,drag=false;
    hdr.addEventListener('mousedown', function(e){ if(e.target.closest('.k-hb')){return;} drag=true; var r=border.getBoundingClientRect(); dx=e.clientX-r.left; dy=e.clientY-r.top; e.preventDefault(); });
    document.addEventListener('mousemove', function(e){ if(!drag){return;} border.style.left=Math.max(6,e.clientX-dx)+'px'; border.style.top=Math.max(6,e.clientY-dy)+'px'; border.style.right='auto'; border.style.bottom='auto'; });
    document.addEventListener('mouseup', function(){ drag=false; });
    var h=document.getElementById('k-resize'), panel=document.getElementById('k-panel'), rs=false, sx,sy,sw,sh;
    h.addEventListener('mousedown', function(e){ rs=true; sx=e.clientX; sy=e.clientY; sw=border.offsetWidth; sh=panel.offsetHeight; e.preventDefault(); e.stopPropagation(); });
    document.addEventListener('mousemove', function(e){ if(!rs){return;} var nw=Math.max(340,Math.min(640,sw-(e.clientX-sx))); var nh=Math.max(440,Math.min(820,sh-(e.clientY-sy))); border.style.width=nw+'px'; panel.style.height=nh+'px'; });
    document.addEventListener('mouseup', function(){ rs=false; });
  })();

  /* ---------- boot ---------- */
  updateMemBadge();
  loadCompanies();
  setTimeout(checkNudge, 1500);
})();
</script>
