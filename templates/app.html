{% extends "app_base.html" %}
{% block styles %}
<style>
  .main{ flex:1; display:flex; align-items:center; justify-content:center }
  .wrap{ width:100%; max-width:1160px; padding:48px 24px; position:relative; z-index:1 }
  .intro{ text-align:center; margin-bottom:34px }
  .intro h1{ margin:0 0 8px; font-size:clamp(26px,4vw,38px); font-weight:700; letter-spacing:-.025em; color:#f2f6ff }
  .intro p{ margin:0 auto; max-width:560px; color:var(--tx2); font-size:15px; line-height:1.6 }
  .cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px }
  .card{
    display:flex; flex-direction:column; text-decoration:none; color:inherit;
    background:
      linear-gradient(160deg, color-mix(in srgb, var(--ac) 14%, transparent), transparent 60%),
      rgba(12,15,30,.62);
    border:1px solid color-mix(in srgb, var(--ac) 26%, rgba(255,255,255,.09));
    border-radius:18px; padding:26px; min-height:196px;
    position:relative; overflow:hidden;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    box-shadow:0 10px 40px -18px rgba(0,0,0,.6);
    transition:border-color .25s ease, transform .25s ease, box-shadow .25s ease;
  }
  .card::before{ content:""; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--ac), transparent 85%) }
  .card:hover{ transform:translateY(-3px);
    border-color:color-mix(in srgb, var(--ac) 55%, transparent);
    box-shadow:0 18px 52px -20px color-mix(in srgb, var(--ac) 45%, transparent) }
  .card .cicon{ width:48px; height:48px; border-radius:13px; flex:none; margin-bottom:16px;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg, var(--ac), var(--ac2));
    box-shadow:0 12px 34px -12px color-mix(in srgb, var(--ac) 70%, transparent) }
  .card .cicon svg{ width:24px; height:24px; stroke:#fff }
  .card h3{ margin:0 0 6px; font-size:19px; font-weight:600; letter-spacing:-.01em; color:#f2f6ff }
  .card p{ margin:0; font-size:13.5px; line-height:1.6; color:var(--tx2) }
  .card .more{ margin-top:auto; padding-top:16px; font-size:13px; font-weight:600;
    color:color-mix(in srgb, var(--ac) 72%, #fff) }
  @media (max-width:900px){ .cards{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:720px){ .cards{grid-template-columns:1fr} .wrap{padding:32px 16px} }
</style>
{% endblock %}
{% block content %}
<main class="main">
  <div class="wrap">
    <div class="intro">
      <h1>Your AI agents</h1>
      <p>Pick an agent to get started. Each one is a focused tool you can run right here.</p>
    </div>
    <div class="cards">
      {% for a in agents %}
      <a class="card" href="/app/{{ a.slug }}" style="--ac:{{ a.ac }};--ac2:{{ a.ac2 }}">
        <div class="cicon">{{ a.icon|safe }}</div>
        <h3>{{ a.name }}</h3>
        <p>{{ a.tagline }}</p>
        <div class="more">Open &rarr;</div>
      </a>
      {% endfor %}
    </div>
  </div>
</main>
{% endblock %}
