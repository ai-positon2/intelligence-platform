{% extends "app_base.html" %}
{% block title %}{{ agent.name }} · Intelligence by Position2{% endblock %}
{% block styles %}
<style>
  .eglow{ position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(720px 460px at 14% -6%, color-mix(in srgb, var(--ac) 20%, transparent), transparent 60%),
      radial-gradient(620px 460px at 100% 8%, color-mix(in srgb, var(--ac2) 16%, transparent), transparent 60%) }
  .ewrap{ flex:1; display:flex; flex-direction:column; min-height:0; position:relative; z-index:1;
    padding:32px 34px 34px; gap:20px; max-width:1320px; width:100%; margin:0 auto; box-sizing:border-box }
  .ebar{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding:14px 20px; border-radius:16px; border:1px solid var(--line);
    background:rgba(14,17,32,.55); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px) }
  .ebar .eleft{ display:flex; align-items:center; gap:14px; min-width:0 }
  .ebar a.back{ display:inline-flex; align-items:center; gap:7px; text-decoration:none; color:var(--tx2);
    font-size:13px; font-weight:600; padding:8px 14px; border-radius:999px; flex:none;
    border:1px solid var(--line); background:rgba(255,255,255,.03);
    transition:border-color .2s ease, background .2s ease, color .2s ease, transform .2s ease }
  .ebar a.back:hover{ color:var(--tx); border-color:rgba(255,255,255,.2); background:rgba(255,255,255,.06); transform:translateX(-2px) }
  .ebar .etitle{ display:flex; align-items:center; gap:13px; min-width:0 }
  .ebar .etxt{ min-width:0 }
  .ebar .etxt b{ display:block; font-weight:700; color:#f2f6ff; font-size:16.5px; letter-spacing:-.01em; line-height:1.2 }
  .ebar .etxt span{ display:block; font-size:12px; color:var(--tx2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .ebar .eicon{ width:38px; height:38px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg, var(--ac), var(--ac2));
    box-shadow:0 10px 26px -10px color-mix(in srgb, var(--ac) 65%, transparent) }
  .ebar .eicon svg{ width:18px; height:18px; stroke:#fff }
  .ebar .elive{ display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; color:color-mix(in srgb, var(--ac) 75%, #fff); flex:none }
  .ebar .elive .d{ width:7px; height:7px; border-radius:50%; background:var(--ac); box-shadow:0 0 9px var(--ac); animation:epulse 2s ease-in-out infinite }
  @keyframes epulse{ 0%,100%{ opacity:1 } 50%{ opacity:.4 } }
  .frame-wrap{ flex:1; position:relative; min-height:0; background:#0a0d1a;
    border-radius:22px; border:1px solid color-mix(in srgb, var(--ac) 22%, var(--line)); overflow:hidden;
    box-shadow:0 30px 70px -30px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.02) inset }
  .frame-wrap::before{ content:""; position:absolute; top:0; left:0; right:0; height:3px; z-index:2;
    background:linear-gradient(90deg, var(--ac), var(--ac2), transparent 90%) }
  .frame-loader{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--tx2); font-size:13px; gap:10px; transition:opacity .4s ease }
  .frame-loader.hidden{ opacity:0; pointer-events:none }
  .frame-loader .sp{ width:18px; height:18px; border-radius:50%; border:2px solid rgba(255,255,255,.18);
    border-top-color:var(--ac); animation:esp 1s linear infinite }
  @keyframes esp{ to{ transform:rotate(360deg) } }
  iframe.tool{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block }
  @media (max-width:720px){
    .ewrap{ padding:18px 16px 20px; gap:14px }
    .ebar .etxt span{ display:none }
    .ebar .elive{ display:none }
  }
</style>
{% endblock %}
{% block content %}
<div class="eglow" style="--ac:{{ agent.ac }};--ac2:{{ agent.ac2 }}"></div>
<div class="ewrap" style="--ac:{{ agent.ac }};--ac2:{{ agent.ac2 }}">
  <div class="ebar">
    <div class="eleft">
      <a class="back" href="/app/{{ agent.slug }}">&larr; Back</a>
      <div class="etitle">
        <span class="eicon">{{ agent.icon|safe }}</span>
        <div class="etxt"><b>{{ agent.name }}</b><span>{{ agent.tagline }}</span></div>
      </div>
    </div>
    <div class="elive"><span class="d"></span>Live</div>
  </div>
  <div class="frame-wrap">
    <div class="frame-loader" id="floader"><span class="sp"></span> Loading {{ agent.name }}…</div>
    <iframe class="tool" id="toolFrame" src="{{ embed_url }}" allow="clipboard-write; clipboard-read; fullscreen"></iframe>
  </div>
</div>
<script>
  (function(){
    var fr=document.getElementById('toolFrame'), ld=document.getElementById('floader');
    if(fr){ fr.addEventListener('load', function(){ setTimeout(function(){ if(ld) ld.classList.add('hidden'); }, 800); }); }
    setTimeout(function(){ if(ld) ld.classList.add('hidden'); }, 8000);
  })();
</script>
{% endblock %}
