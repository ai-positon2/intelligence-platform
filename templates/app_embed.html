{% extends "app_base.html" %}
{% block title %}{{ agent.name }} · Intelligence by Position2{% endblock %}
{% block styles %}
<style>
  .ewrap{ flex:1; display:flex; flex-direction:column; min-height:0 }
  .ebar{ display:flex; align-items:center; gap:14px; padding:12px 26px; border-bottom:1px solid var(--line);
    background:rgba(4,5,16,.5) }
  .ebar a.back{ display:inline-flex; align-items:center; gap:7px; text-decoration:none; color:var(--tx2);
    font-size:13px; font-weight:500 }
  .ebar a.back:hover{ color:var(--tx) }
  .ebar .etitle{ display:flex; align-items:center; gap:11px; font-weight:600; color:#f2f6ff; font-size:15px }
  .ebar .eicon{ width:30px; height:30px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(145deg, var(--ac), var(--ac2)) }
  .ebar .eicon svg{ width:16px; height:16px; stroke:#fff }
  .ebar .sep{ color:var(--tx3) }
  .frame-wrap{ flex:1; position:relative; min-height:0; background:#0a0d1a }
  .frame-loader{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--tx2); font-size:13px; gap:10px; transition:opacity .4s ease }
  .frame-loader.hidden{ opacity:0; pointer-events:none }
  .frame-loader .sp{ width:18px; height:18px; border-radius:50%; border:2px solid rgba(255,255,255,.18);
    border-top-color:var(--ac); animation:esp 1s linear infinite }
  @keyframes esp{ to{ transform:rotate(360deg) } }
  iframe.tool{ position:absolute; inset:0; width:100%; height:100%; border:0; display:block }
</style>
{% endblock %}
{% block content %}
<div class="ewrap" style="--ac:{{ agent.ac }};--ac2:{{ agent.ac2 }}">
  <div class="ebar">
    <a class="back" href="/app/{{ agent.slug }}">&larr; Back</a>
    <span class="sep">·</span>
    <span class="etitle"><span class="eicon">{{ agent.icon|safe }}</span>{{ agent.name }}</span>
  </div>
  <div class="frame-wrap">
    <div class="frame-loader" id="floader"><span class="sp"></span> Loading {{ agent.name }}…</div>
    <iframe class="tool" id="toolFrame" src="{{ embed_url }}" allow="clipboard-write; clipboard-read; fullscreen"></iframe>
  </div>
</div>
<script>
  (function(){
    var fr=document.getElementById('toolFrame'), ld=document.getElementById('floader');
    if(fr){ fr.addEventListener('load', function(){ setTimeout(function(){ if(ld) ld.classList.add('hidden'); }, 800); }); }
    setTimeout(function(){ if(ld) ld.classList.add('hidden'); }, 8000);
  })();
</script>
{% endblock %}
