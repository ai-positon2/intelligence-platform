<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Intelligence by Position2{% endblock %}</title>
  <link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#040510; --tx:#e8ecf5; --tx2:#9aa4bd; --tx3:#6b7590;
      --logo-bg:#151b2e; --line:rgba(255,255,255,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh; background:var(--bg); color:var(--tx);
      font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased; position:relative; overflow-x:hidden;
      display:flex; flex-direction:column;
    }
    a{color:inherit}

    /* ---- header / topbar ---- */
    .hdr{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 26px; position:sticky; top:0; z-index:10;
      border-bottom:1px solid var(--line);
      background:rgba(4,5,16,.62); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    }
    .brand{ display:flex; align-items:center; gap:12px; text-decoration:none }
    .brand-icon{
      width:34px; height:34px; border-radius:50%; overflow:hidden;
      background:var(--logo-bg); display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 0 1px rgba(255,255,255,.06);
    }
    .brand-icon img{ display:block; width:100%; height:100%; object-fit:contain }
    .brand-name{ font-weight:600; font-size:16px; letter-spacing:-.01em; color:var(--tx) }
    .hdr-right{ display:flex; align-items:center; gap:14px }

    .clock{
      display:flex; align-items:center; gap:8px;
      padding:7px 13px; border-radius:999px;
      border:1px solid var(--line); background:rgba(255,255,255,.03);
      font-size:12.5px; color:var(--tx2); white-space:nowrap;
    }
    .clock .dot{ width:7px; height:7px; border-radius:50%; background:#34d399; box-shadow:0 0 8px #34d399 }
    .clock em{ font-style:normal; color:#34d399; font-size:11px; text-transform:uppercase; letter-spacing:.06em }

    .user-menu{ position:relative }
    .user-pill{
      display:flex; align-items:center; gap:9px; cursor:pointer;
      padding:5px 11px 5px 6px; border-radius:999px;
      border:1px solid var(--line); background:rgba(255,255,255,.03);
      transition:border-color .2s ease, background .2s ease;
    }
    .user-pill:hover{ border-color:rgba(255,255,255,.2); background:rgba(255,255,255,.05) }
    .user-avatar{
      width:28px; height:28px; border-radius:50%; overflow:hidden; flex:none;
      display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg,#22d3ee,#8b5cf6); color:#04121a;
      font-size:11px; font-weight:700;
    }
    .user-avatar img{ width:100%; height:100%; object-fit:cover }
    .user-name{ font-size:14px; font-weight:500; color:var(--tx) }
    .pill-chevron{ font-size:9px; color:var(--tx2) }

    .user-dropdown{
      position:absolute; top:calc(100% + 10px); right:0; width:248px;
      background:#0b0e1c; border:1px solid var(--line); border-radius:14px;
      box-shadow:0 24px 60px -18px rgba(0,0,0,.75); overflow:hidden;
      opacity:0; visibility:hidden; transform:translateY(-6px);
      transition:opacity .18s ease, transform .18s ease, visibility .18s;
    }
    .user-menu.open .user-dropdown{ opacity:1; visibility:visible; transform:translateY(0) }
    .dd-header{ padding:15px 16px; border-bottom:1px solid var(--line) }
    .dd-name{ font-size:14px; font-weight:600; color:var(--tx) }
    .dd-email{ font-size:12.5px; color:var(--tx2); margin-top:2px; word-break:break-all }
    .dd-items{ padding:6px }
    .dd-item{
      display:flex; align-items:center; gap:10px; text-decoration:none;
      padding:10px 11px; border-radius:9px; font-size:13.5px; color:var(--tx2);
    }
    .dd-item:hover{ background:rgba(255,255,255,.05); color:var(--tx) }
    .dd-item.danger:hover{ background:rgba(251,113,133,.12); color:#fb7185 }
    .dd-item-icon{ font-size:13px; width:16px; text-align:center }

    @media (max-width:720px){
      .hdr{ padding:12px 16px }
      .user-name{ display:none }
    }
  </style>
  {% block styles %}{% endblock %}
</head>
<body>
  <header class="hdr">
    <a class="brand" href="/app">
      <div class="brand-icon"><img src="/static/logo-mark.svg?v=3" alt="Intelligence"></div>
      <span class="brand-name">Intelligence</span>
    </a>
    <div class="hdr-right">
      <div class="clock"><span class="dot"></span><span id="clk">--:--</span><em>live</em></div>
      <div class="user-menu" id="userMenu">
        <div class="user-pill" onclick="toggleMenu(event)">
          <div class="user-avatar">
            {% if user.picture %}<img src="{{ user.picture }}" alt="" referrerpolicy="no-referrer">
            {% else %}{{ (user.name or 'U')[:2]|upper }}{% endif %}
          </div>
          <span class="user-name">{{ user.given_name or user.name or 'User' }}</span>
          <span class="pill-chevron">&#9660;</span>
        </div>
        <div class="user-dropdown">
          <div class="dd-header">
            <div class="dd-name">{{ user.name or 'User' }}</div>
            <div class="dd-email">{{ user.email }}</div>
          </div>
          <div class="dd-items">
            <a href="/logout" class="dd-item danger"><span class="dd-item-icon">&rarr;</span> Sign out</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  {% block content %}{% endblock %}

  <!-- Shared WebGL particle background (same as internal dashboards) -->
  <script src="/static/js/pfx_bg.js?v=3" defer></script>
  <script>
    function toggleMenu(e){ if(e) e.stopPropagation(); document.getElementById('userMenu').classList.toggle('open'); }
    document.addEventListener('click', function(e){
      var m = document.getElementById('userMenu');
      if (m && !m.contains(e.target)) m.classList.remove('open');
    });
    function tickClock(){
      var el = document.getElementById('clk'); if(!el) return;
      try { el.textContent = new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Kolkata'}) + ' IST'; }
      catch(err){ el.textContent = new Date().toLocaleTimeString(); }
    }
    tickClock(); setInterval(tickClock, 30000);
  </script>
</body>
</html>
