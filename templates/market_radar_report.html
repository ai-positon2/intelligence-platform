<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Radar report</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ds-tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/grid-tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/aurora-app.css?v=3">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/market_radar.css') }}?v=6">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/market_radar_report.css') }}?v=1">
</head>
<body>
  <div class="topbar">
    <div class="tl">
      <a href="/p2/hub" class="brand">
        <div class="brand-icon" style="background:#151b2e;box-shadow:none;border-radius:var(--radius-md);overflow:hidden;display:inline-flex;align-items:center;justify-content:center;padding:5px 8px"><img src="/static/logo-lockup.svg?v=1" alt="arena by Position2" style="display:block;width:auto;height:36px;object-fit:contain"></div>
      </a>
      <div class="bc">
        <a href="/p2/hub">Hub</a><span class="bc-sep">›</span>
        <a href="/p2/admin/internal-usage">Admin</a><span class="bc-sep">›</span>
        <a href="/p2/admin/market-radar#company-{{ client_id }}">Market Radar</a><span class="bc-sep">›</span>
        <span class="bc-cur">Report</span>
      </div>
    </div>
    <div class="tr">
      <div class="user-menu" id="userMenu">
        <div class="user-pill" id="userPill" onclick="toggleMenu()">
          <div class="avatar">
            {% if user.picture %}<img src="{{ user.picture }}" alt="" />
            {% else %}{{ (user.name or 'U')[:2]|upper }}{% endif %}
          </div>
          <span class="uname">{{ user.given_name or user.name or 'Admin' }}</span>
          <span class="pill-chevron">▼</span>
        </div>
        <div class="user-dropdown" id="userDropdown">
          <div class="dd-header">
            <div class="dd-name">{{ user.name or 'User' }}</div>
            <div class="dd-email">{{ user.email }}</div>
          </div>
          <div class="dd-items">{% include "_admin_menu.html" %}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="main mr rr" id="rr" data-client="{{ client_id }}">
    <div id="rrBody" aria-live="polite"><div class="card"><div class="mr-empty">Loading the report…</div></div></div>
  </div>

  <script>
    function toggleMenu(){var d=document.getElementById('userDropdown'),p=document.getElementById('userPill');var o=d.classList.contains('open');d.classList.toggle('open',!o);p.classList.toggle('open',!o);}
    document.addEventListener('click',function(e){var m=document.getElementById('userMenu');if(m&&!m.contains(e.target)){document.getElementById('userDropdown').classList.remove('open');document.getElementById('userPill').classList.remove('open');}});
  </script>
  <script src="{{ url_for('static', filename='js/market_radar_report.js') }}?v=2"></script>
  <script src="{{ url_for('static', filename='js/page_track.js') }}?v=1" data-title="Market Radar report" data-email="{{ user.email if user else '' }}"></script>
</body>
</html>
